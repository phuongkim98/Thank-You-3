<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bà T nghỉ việc 😎</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
html{scroll-behavior:smooth;}
body{
    margin:0;
    font-family:'Segoe UI';
    background: radial-gradient(circle,#1a1a2e,#0f0f1a);
    color:white;
}

.section{
    padding:80px 20px;
    text-align:center;
    max-width:700px;
    margin:auto;
    opacity:0;
    transform:translateY(40px);
    transition:0.6s;
}
.section.show{
    opacity:1;
    transform:translateY(0);
}

h1,h2{margin-bottom:20px;}

.btn{
    display:block;
    width:100%;
    max-width:300px;
    margin:10px auto;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#9b59b6,#8e44ad);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.card{
    background:#1a1a2e;
    margin:10px 0;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    border:1px solid #333;
}

.wish{
    display:none;
    margin-top:10px;
    color:#ccc;
}

/* TAROT */
.tarot-card{
    width:180px;height:280px;
    margin:20px auto;
    perspective:1000px;
}

.inner{
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:1s;
    position:relative;
}

.flip .inner{transform:rotateY(180deg);}

.front,.back{
    position:absolute;
    width:100%;height:100%;
    border-radius:15px;
    backface-visibility:hidden;
}

.front{
    background:#111;
    box-shadow:0 0 20px #9b59b6;
}

.back{
    transform:rotateY(180deg);
    background:#000;
    border:2px solid #9b59b6;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:10px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="section">
<h1>Bà T nghỉ việc 😎</h1>
<p id="countdown"></p>
<a href="#trade"><button class="btn">Xem Team</button></a>
</div>

<!-- TRADE -->
<div id="trade" class="section">
<h2>Team Trade</h2>

<h3>Offline</h3>

<div class="card" onclick="toggleWish(this,'Chúc chị luôn xinh ✨')">Chị Diệp<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Chúc anh mãi đỉnh 😎')">Anh Tường<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn vui vẻ nha 😆')">Nhựt Ling<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn rực rỡ ✨')">Chị Phương<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Code không bug 😏')">Đức<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Làm đâu trúng đó 💸')">Nam<div class="wish"></div></div>

<h3>Online</h3>

<div class="card" onclick="toggleWish(this,'Online nhưng vẫn đỉnh 😎')">Mơ<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn nhiều năng lượng 🌟')">Chị Trân<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn tỏa sáng ✨')">Chị Ánh<div class="wish"></div></div>

</div>

<!-- ASA -->
<div class="section">
<h2>Team Asa</h2>

<h3>Offline</h3>

<div class="card" onclick="toggleWish(this,'Luôn chill 😌')">Chi<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Nhiều năng lượng 💪')">Chị Oanh<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn vui 😆')">Hoài<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Rực rỡ ✨')">Chị Quý<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Phong độ 😎')">Anh Quang<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Thắng lớn 💸')">Thái<div class="wish"></div></div>

<h3>Online</h3>

<div class="card" onclick="toggleWish(this,'Luôn xinh ✨')">Chị Mai<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn vui 😄')">Chị Thảo<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Năng lượng 🌟')">Chị Huyền<div class="wish"></div></div>

</div>

<!-- TAROT -->
<div class="section">
<h2>🔮 Tarot cho bạn</h2>

<button class="btn" onclick="draw()">Rút bài</button>

<div id="card" class="tarot-card">
    <div class="inner">
        <div class="front"></div>
        <div class="back">
            <div id="cardName"></div>
        </div>
    </div>
</div>

<p id="meaning"></p>
</div>

<!-- END -->
<div class="section">
<h2>Cảm ơn mọi người 💜</h2>
<button class="btn" onclick="boom()">Nhấn phát cuối 🎉</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

// scroll animation
const secs=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
    secs.forEach(s=>{
        if(s.getBoundingClientRect().top<window.innerHeight-100){
            s.classList.add('show');
        }
    });
});

// countdown
const end=new Date("2026-04-28").getTime();
setInterval(()=>{
    let d=end-new Date().getTime();
    document.getElementById('countdown').innerText=
    "Còn "+Math.floor(d/86400000)+" ngày là nghỉ 😏";
},1000);

// wish toggle
function toggleWish(el,text){
    let w=el.querySelector('.wish');
    w.style.display = w.style.display==="block"?"none":"block";
    w.innerText=text;
}

// tarot
function draw(){
    const data=[
        {n:"The Salary 💸",t:"Tiền đến rồi đi",img:"https://i.imgur.com/8Km9tLL.png",c:"#2ecc71"},
        {n:"The Deadline 💀",t:"Deadline đang tới",img:"https://i.imgur.com/jTq7GQK.png",c:"#e74c3c"},
        {n:"The Drama 🎭",t:"Drama everywhere",img:"https://i.imgur.com/3ZQ3Z6F.png",c:"#9b59b6"},
        {n:"The Sleep 😴",t:"Ngủ đi",img:"https://i.imgur.com/8Km9tLL.png",c:"#3498db"},
        {n:"The Lucky 🍀",t:"Bạn hên đấy",img:"https://i.imgur.com/jTq7GQK.png",c:"#1abc9c"}
    ];

    const r=data[Math.floor(Math.random()*data.length)];

    let card=document.getElementById("card");
    let name=document.getElementById("cardName");

    document.querySelector('.front').style.background=
    `url(${r.img}) center/contain no-repeat`;

    card.classList.remove("flip");

    setTimeout(()=>{
        name.innerText=r.n;
        card.classList.add("flip");
        document.getElementById("meaning").innerText=r.t;

        confetti({particleCount:120,spread:80,colors:[r.c]});
    },300);
}

// end confetti
function boom(){
    confetti({particleCount:200,spread:120});
}

</script>

</body>
</html>
