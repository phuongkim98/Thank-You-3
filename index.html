<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông điệp từ vũ trụ ✨</title>

<style>
body{
    font-family:'Segoe UI';
    background:#fff0f6;
    text-align:center;
    padding:40px;
}

.page{display:none;}
.active{display:block;}

input{
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    width:200px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#ffafcc;
    color:white;
    cursor:pointer;
}

.tarot{
    margin-top:20px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h2>Nhập mã nhân viên của bạn 👇</h2>
    <input id="codeInput" placeholder="VD: NV01">
    <br>
    <button onclick="login()">Xác nhận</button>
    <p id="err" style="color:red;"></p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h2 id="name"></h2>
    <button onclick="go('page3')">Nhận thông điệp 🔮</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <h2>Lá bài của bạn</h2>

    <div class="tarot">
        <img id="img" width="200">
        <p id="msg"></p>
    </div>

    <button onclick="go('page4')">Tiếp tục</button>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <h2>Cảm ơn mọi người 💖</h2>
</div>

<script>

// danh sách mã
const users = {
    "156":"Chị Diệp",
    "8644":"Anh Tường",
    "11079":"Quàng Thượng",
    "11732":"Chị Phương",
    "11585":"Đức",
    "11659":"Nam",
    "10154":"Hoài",
    "2705":"Chị Quý",
    "4943":"Chị Oanh",
    "7172":"Chị Mai",
    "10154":"Chị Thảo",
    "4943":"Chị Huyền",
    "7172":"Mơ",
    "7172":"Thái",
    "7172":"Chị Trân",
    "10154":"Chị Ánh",
    "2705":"Anh Quang",
    "CN":"Công Túa",
    "HH":"Mít ren Phú Thọ",
    "LH":"Bà chủ vựa dừa tương lai",
    "6352":"Chi",
};

// tarot
const data = [
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj19.jpg", msg:"Bạn đang toả sáng theo cách riêng, cứ thế mà phát huy ✨"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj17.jpg", msg:"Một cơ hội tốt đang tới gần, nhớ nắm cho chắc nha 💰"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/pents01.jpg", msg:"Hôm nay vibe của bạn rất ổn, đi đâu cũng dễ gặp may 😏"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups13.jpg", msg:"Có người đang âm thầm quý bạn đó, không phải tự nhiên đâu nha 👀"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/wands12.jpg", msg:"Làm cái bạn đang nghĩ đi, khả năng cao là sẽ ổn áp 🔥"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups10.jpg", msg:"Một niềm vui nhỏ đang trên đường tới, cứ chờ đi 🤡"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups11.jpg", msg:"Bạn đang ngày càng xịn hơn mà chưa nhận ra đó 💎"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj10.jpg", msg:"Vận may đang quay lại phía bạn, tới công chuyện rồi 🎡"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/pents09.jpg", msg:"Mọi thứ đang đi đúng hướng, đừng lo nhiều nữa nha 🌈"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj00.jpg", msg:"Cứ thử đi, đôi khi liều một chút lại hay 😏"}
];
];

// check đã login chưa
let saved = localStorage.getItem("employee");

if(saved){
    loadUser(saved);
}

// login
function login(){
    let code = document.getElementById("codeInput").value.trim();

    if(localStorage.getItem("employee")){
        // đã có rồi thì không cho đổi
        if(code !== localStorage.getItem("employee")){
            document.getElementById("err").innerText="Bạn chỉ được xem của mình thôi 😏";
            return;
        }
    }

    if(users[code]){
        localStorage.setItem("employee", code);
        loadUser(code);
    }else{
        document.getElementById("err").innerText="Sai mã rồi 😭";
    }
}

// load user
function loadUser(code){
    document.getElementById("name").innerText="Hello " + users[code] + " 👋";
    go('page2');
}

// chuyển page
function go(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if(id==="page3"){
        drawTarot();
    }
}

// random tarot
function drawTarot(){
    let r = tarot[Math.floor(Math.random()*tarot.length)];

    document.getElementById("img").src = r.img;
    document.getElementById("msg").innerText = r.msg;
}

</script>

</body>
</html>
