```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bà T nghỉ việc 😎</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
html{scroll-behavior:smooth;}

body{
    margin:0;
    font-family:'Segoe UI';
    background-color:#fff0f6;
    background-image: radial-gradient(#ffafcc 1px, transparent 1px);
    background-size: 20px 20px;
    color:#333;
}

/* 🧸 GẤU */
.bear{
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 120px;
    z-index: 999;
    pointer-events: none;
    animation: float 4s ease-in-out infinite;
}
.bear-top{
    width:120px;
    margin-bottom:10px;
}

@keyframes float{
    0%{transform: translateY(0);}
    50%{transform: translateY(-10px);}
    100%{transform: translateY(0);}
}

.section{
    padding:80px 20px;
    text-align:center;
    max-width:700px;
    margin:auto;
    opacity:0;
    transform:translateY(40px);
    transition:0.6s;
}
.section.show{
    opacity:1;
    transform:translateY(0);
}

h1,h2{margin-bottom:20px;}

.btn{
    display:block;
    width:100%;
    max-width:300px;
    margin:10px auto;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ffafcc,#fb6f92);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.card{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    border:1px solid #eee;
}

.wish{
    display:none;
    margin-top:10px;
    color:#555;
}

/* TAROT */
.tarot-card{
    width:180px;height:280px;
    margin:20px auto;
    perspective:1000px;
}

.inner{
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:1s;
    position:relative;
}

.flip .inner{transform:rotateY(180deg);}

.front,.back{
    position:absolute;
    width:100%;height:100%;
    border-radius:15px;
    backface-visibility:hidden;
}

.front{
    background:#fff;
    box-shadow:0 0 20px #ffafcc;
}

.back{
    transform:rotateY(180deg);
    background:#fff;
    border:2px solid #ffafcc;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:15px;
}

/* ✨ FIX SPACING CHỮ Ở ĐÂY */
#cardName{
    font-weight:bold;
    margin-bottom:12px;
    font-size:16px;
}

#meaning{
    margin-top:12px;
    line-height:1.6;
    color:#555;
    font-size:14px;
}
</style>
</head>

<body>

<img class="bear" src="https://i.imgur.com/6R8QhJH.png">

<div class="section">
<img class="bear-top" src="https://i.imgur.com/6R8QhJH.png">
<h1>Bà T nghỉ việc 😎</h1>
<p id="countdown"></p>
<a href="#trade"><button class="btn">Xem Team</button></a>
</div>

<div id="trade" class="section">
<h2>Team Trade</h2>

<h3>Offline</h3>
<div class="card" onclick="toggleWish(this,'Chúc chị luôn xinh ✨')">Chị Diệp<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Chúc anh mãi đỉnh 😎')">Anh Tường<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Luôn vui 😆')">Nhựt Ling<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Rực rỡ ✨')">Chị Phương<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Không bug 😏')">Đức<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Trúng lớn 💸')">Nam<div class="wish"></div></div>

<h3>Online</h3>
<div class="card" onclick="toggleWish(this,'Đỉnh 😎')">Mơ<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Năng lượng 🌟')">Chị Trân<div class="wish"></div></div>
<div class="card" onclick="toggleWish(this,'Tỏa sáng ✨')">Chị Ánh<div class="wish"></div></div>
</div>

<div class="section">
<h2>🔮 Tarot cho bạn</h2>

<button class="btn" onclick="draw()">Rút bài</button>

<div id="card" class="tarot-card">
    <div class="inner">
        <div class="front"></div>
        <div class="back">
            <div id="cardName"></div>
        </div>
    </div>
</div>

<p id="meaning"></p>
</div>

<div class="section">
<h2>Cảm ơn mọi người 💖</h2>
<button class="btn" onclick="boom()">🎉</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const secs=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
    secs.forEach(s=>{
        if(s.getBoundingClientRect().top<window.innerHeight-100){
            s.classList.add('show');
        }
    });
});

const end=new Date("2026-04-28").getTime();
setInterval(()=>{
    let d=end-new Date().getTime();
    document.getElementById('countdown').innerText=
    "Còn "+Math.floor(d/86400000)+" ngày là nghỉ 😏";
},1000);

function toggleWish(el,text){
    let w=el.querySelector('.wish');
    w.style.display = w.style.display==="block"?"none":"block";
    w.innerText=text;
}

function draw(){
    const data=[
        {n:"The Lucky 🍀",t:"Bạn hên đấy 😏",img:"https://i.imgur.com/8Km9tLL.png",c:"#ff69b4"},
        {n:"The Drama 🎭",t:"Drama everywhere",img:"https://i.imgur.com/jTq7GQK.png",c:"#c77dff"},
        {n:"The Sleep 😴",t:"Ngủ đi rồi tính tiếp",img:"https://i.imgur.com/3ZQ3Z6F.png",c:"#90dbf4"}
    ];

    const r=data[Math.floor(Math.random()*data.length)];

    let card=document.getElementById("card");

    document.querySelector('.front').style.background=
    `url(${r.img}) center/contain no-repeat`;

    card.classList.remove("flip");

    setTimeout(()=>{
        document.getElementById("cardName").innerText=r.n;
        card.classList.add("flip");
        document.getElementById("meaning").innerText=r.t;

        confetti({particleCount:120,spread:80,colors:[r.c]});
    },300);
}

function boom(){
    confetti({particleCount:200,spread:120});
}

</script>

</body>
</html>
```
