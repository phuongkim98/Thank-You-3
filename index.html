<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông điệp từ vũ trụ ✨</title>

<style>
body{
    font-family:'Segoe UI';
    background:#fff0f6;
    text-align:center;
    padding:40px;
}

.page{display:none;}
.active{display:block;}

input{
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    width:200px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#ffafcc;
    color:white;
    cursor:pointer;
}

.tarot{
    margin-top:20px;
}

#wishText{
    margin-top:20px;
    line-height:1.7;
    color:#555;
    white-space: pre-wrap;   /* 👈 cho xuống dòng */
    word-break: break-word;  /* 👈 tránh tràn chữ */
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h2>Nhập mã nhân viên của bạn 👇</h2>
    <input id="codeInput" placeholder="VD: 156">
    <br>
    <button onclick="login()">Xác nhận</button>
    <p id="err" style="color:red;"></p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h2 id="name"></h2>
    <p id="wishText"></p>
    <button onclick="go('page3')">Nhận thông điệp 🔮</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <h2>Lá bài của bạn</h2>

    <div class="tarot">
        <img id="img" width="200">
        <p id="msg"></p>
    </div>

    <button onclick="go('page4')">Tiếp tục</button>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <h2>Cảm ơn mọi người 💖</h2>
</div>

<script>

// USERS
const users = {
    "156":"Chị Diệp",
    "8644":"Anh Tường",
    "11079":"Quàng Thượng",
    "11732":"Chị Phương",
    "11585":"Đức",
    "11659":"Nam",
    "10154":"Chị Ánh",
    "2705":"Anh Quang",
    "4943":"Chị Huyền",
    "7172":"Chị Trân",
    "CN":"Công Túa",
    "HH":"Mít ren Phú Thọ",
    "LH":"Bà chủ vựa dừa tương lai",
    "6352":"Chi"
};

// TAROT
const data = [
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj19.jpg", msg:"Bạn đang toả sáng theo cách riêng, cứ thế mà phát huy ✨"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj17.jpg", msg:"Một cơ hội tốt đang tới gần, nhớ nắm cho chắc nha 💰"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/pents01.jpg", msg:"Hôm nay vibe của bạn rất ổn, đi đâu cũng dễ gặp may 😏"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups13.jpg", msg:"Có người đang âm thầm quý bạn đó 👀"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/wands12.jpg", msg:"Làm cái bạn đang nghĩ đi, khả năng cao là sẽ ổn áp 🔥"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups10.jpg", msg:"Một niềm vui nhỏ đang trên đường tới 🤡"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/cups11.jpg", msg:"Bạn đang ngày càng xịn hơn đó 💎"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj10.jpg", msg:"Vận may đang quay lại phía bạn 🎡"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/pents09.jpg", msg:"Mọi thứ đang đi đúng hướng 🌈"},
 {img:"https://hoctarot.com/wp-content/uploads/2020/01/maj00.jpg", msg:"Cứ thử đi, đôi khi liều lại hay 😏"}
];

// AUTO LOGIN
let saved = localStorage.getItem("employee");
if(saved){
    loadUser(saved);
}

// LOGIN
function login(){
    let code = document.getElementById("codeInput").value.trim();

    if(localStorage.getItem("employee")){
        if(code !== localStorage.getItem("employee")){
            document.getElementById("err").innerText="Bạn chỉ được xem của mình thôi 😏";
            return;
        }
    }

    if(users[code]){
        localStorage.setItem("employee", code);
        loadUser(code);
    }else{
        document.getElementById("err").innerText="Sai mã rồi 😭";
    }
}

// TYPE EFFECT
function typeText(text, elementId){
    let i = 0;
    let el = document.getElementById(elementId);
    el.innerText = "";

    let interval = setInterval(()=>{
        el.innerText += text.charAt(i);
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 20);
}

// LOAD USER + WISH (🔥 đã sửa text chuẩn có khoảng cách)
function loadUser(code){
    document.getElementById("name").innerText = "Hello " + users[code] + " 👋";

    const wishes = [
`Thật sự cảm ơn bạn vì đã đồng hành trong khoảng thời gian vừa rồi.

Có thể không phải lúc nào cũng nói ra, nhưng sự có mặt của bạn đã làm mọi thứ dễ chịu hơn rất nhiều.

Mong là thời gian tới bạn sẽ gặp thật nhiều điều tốt đẹp, vừa vui vừa may mắn 😌✨`,

`Làm việc cùng bạn là một trải nghiệm rất đáng nhớ.

Dù có lúc bận rộn hay hơi stress, nhưng vẫn có những khoảnh khắc rất vui.

Chúc bạn lúc nào cũng nhiều năng lượng tích cực, việc đến tay là xử gọn 💰😆`,

`Bạn là kiểu người mà càng tiếp xúc càng thấy dễ quý.

Hy vọng hành trình phía trước của bạn sẽ thật suôn sẻ, gặp đúng người, đúng việc, đúng thời điểm.

Bạn đang làm tốt hơn bạn nghĩ rất nhiều đó 💖`,

`Cảm ơn bạn vì đã là một phần của hành trình này.

Có thể mỗi người sẽ đi một hướng, nhưng những gì đã cùng nhau trải qua vẫn rất đáng nhớ.

Chúc bạn phía trước thật nhiều cơ hội xịn xò 🌈`
    ];

    let randomWish = wishes[Math.floor(Math.random()*wishes.length)];
    typeText(randomWish, "wishText");

    go('page2');
}

// NAV
function go(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if(id==="page3"){
        drawTarot();
    }
}

// TAROT
function drawTarot(){
    let r = data[Math.floor(Math.random()*data.length)];

    document.getElementById("img").src = r.img;
    document.getElementById("msg").innerText = r.msg;
}

</script>

</body>
</html>
