```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông điệp từ vũ trụ ✨</title>

<style>
body{
    font-family:'Segoe UI';
    background:#fff0f6;
    text-align:center;
    padding:40px;
}

.page{display:none;}
.active{display:block;}

input{
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    width:200px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#ffafcc;
    color:white;
    cursor:pointer;
}

.tarot{
    margin-top:20px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h2>Nhập mã nhân viên của bạn 👇</h2>
    <input id="codeInput" placeholder="VD: NV01">
    <br>
    <button onclick="login()">Xác nhận</button>
    <p id="err" style="color:red;"></p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h2 id="name"></h2>
    <button onclick="go('page3')">Nhận thông điệp 🔮</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <h2>Lá bài của bạn</h2>

    <div class="tarot">
        <img id="img" width="200">
        <p id="msg"></p>
    </div>

    <button onclick="go('page4')">Tiếp tục</button>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <h2>Cảm ơn mọi người 💖</h2>
</div>

<script>

// danh sách mã
const users = {
    "NV01":"Chị Diệp",
    "NV02":"Anh Tường",
    "NV03":"Nhựt Ling",
    "NV04":"Chị Phương",
    "NV05":"Đức",
    "NV06":"Nam"
};

// tarot
const tarot = [
    {img:"https://i.imgur.com/8Km9tLL.png", msg:"Bạn sắp giàu 😏"},
    {img:"https://i.imgur.com/jTq7GQK.png", msg:"Deadline tới 😭"},
    {img:"https://i.imgur.com/3ZQ3Z6F.png", msg:"Drama né bạn"},
];

// check đã login chưa
let saved = localStorage.getItem("employee");

if(saved){
    loadUser(saved);
}

// login
function login(){
    let code = document.getElementById("codeInput").value.trim();

    if(localStorage.getItem("employee")){
        // đã có rồi thì không cho đổi
        if(code !== localStorage.getItem("employee")){
            document.getElementById("err").innerText="Bạn chỉ được xem của mình thôi 😏";
            return;
        }
    }

    if(users[code]){
        localStorage.setItem("employee", code);
        loadUser(code);
    }else{
        document.getElementById("err").innerText="Sai mã rồi 😭";
    }
}

// load user
function loadUser(code){
    document.getElementById("name").innerText="Hello " + users[code] + " 👋";
    go('page2');
}

// chuyển page
function go(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if(id==="page3"){
        drawTarot();
    }
}

// random tarot
function drawTarot(){
    let r = tarot[Math.floor(Math.random()*tarot.length)];

    document.getElementById("img").src = r.img;
    document.getElementById("msg").innerText = r.msg;
}

</script>

</body>
</html>
```
